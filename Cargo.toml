[workspace]
members = ["crates/zemer-core", "crates/wav", "crates/cue", "crates/zemer-cli"]
resolver = "2"

[package]
name = "zemer-tests"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zemer_test_cli"
path = "crates/zemer-cli/src/main.rs"

[dependencies]
zemer-core.workspace = true
wav.workspace = true

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
version = "0.2.0"

[workspace.dependencies]
zemer-core = { path = "crates/zemer-core", version = "0.2.0" }
wav = { package = "zemer-wav", path = "crates/wav", version = "0.2.0" }
cue = { package = "zemer-cue", path = "crates/cue", version = "0.2.0" }
cue-rw = "0.3.0"
encoding_rs = "=0.8.35"
