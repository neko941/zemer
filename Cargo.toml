[workspace]
members = [
    "crates/core",
    "crates/dsd",
    "crates/metadata",
    "crates/id3",
    "crates/pcm",
    "crates/wav",
    "crates/cue",
    "crates/dsf",
    "crates/dst",
    "crates/dsdiff",
    "crates/flac",
    "crates/ogg",
    "crates/wavpack",
    "crates/aiff",
    "crates/au",
    "crates/caf",
    "crates/raw-pcm",
    "crates/g711",
    "crates/g726",
    "crates/dwvw",
    "crates/ima-adpcm",
    "crates/ms-adpcm",
    "crates/iso9660",
    "crates/vorbis",
    "crates/zemer",
]
resolver = "2"

[package]
name = "zemer-tests"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zemer_test_cli"
path = "crates/zemer/src/main.rs"

[dependencies]
zemer-core.workspace = true
ogg.workspace = true
vorbis.workspace = true
dsf.workspace = true
wav.workspace = true
cue.workspace = true
flac.workspace = true
wavpack.workspace = true
aiff.workspace = true
au.workspace = true
caf.workspace = true
raw-pcm.workspace = true
g711.workspace = true
dsdiff.workspace = true
dst.workspace = true
dwvw.workspace = true
ima-adpcm.workspace = true
iso9660.workspace = true

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
version = "0.7.0"

[workspace.dependencies]
zemer-core = { path = "crates/core", version = "0.7.0" }
zemer-dsd = { path = "crates/dsd", version = "0.7.0" }
zemer-metadata = { path = "crates/metadata", version = "0.7.0" }
id3 = { package = "zemer-id3", path = "crates/id3", version = "0.7.0" }
zemer-pcm = { path = "crates/pcm", version = "0.7.0" }
wav = { package = "zemer-wav", path = "crates/wav", version = "0.7.0" }
cue = { package = "zemer-cue", path = "crates/cue", version = "0.7.0" }
dsf = { package = "zemer-dsf", path = "crates/dsf", version = "0.7.0" }
dst = { package = "zemer-dst", path = "crates/dst", version = "0.7.0" }
dsdiff = { package = "zemer-dsdiff", path = "crates/dsdiff", version = "0.7.0" }
flac = { package = "zemer-flac", path = "crates/flac", version = "0.7.0" }
ogg = { package = "zemer-ogg", path = "crates/ogg", version = "0.7.0" }
wavpack = { package = "zemer-wavpack", path = "crates/wavpack", version = "0.7.0" }
aiff = { package = "zemer-aiff", path = "crates/aiff", version = "0.7.0" }
au = { package = "zemer-au", path = "crates/au", version = "0.7.0" }
caf = { package = "zemer-caf", path = "crates/caf", version = "0.7.0" }
raw-pcm = { package = "zemer-raw-pcm", path = "crates/raw-pcm", version = "0.7.0" }
g711 = { package = "zemer-g711", path = "crates/g711", version = "0.7.0" }
g726 = { package = "zemer-g726", path = "crates/g726", version = "0.7.0" }
dwvw = { package = "zemer-dwvw", path = "crates/dwvw", version = "0.7.0" }
ima-adpcm = { package = "zemer-ima-adpcm", path = "crates/ima-adpcm", version = "0.7.0" }
ms-adpcm = { package = "zemer-ms-adpcm", path = "crates/ms-adpcm", version = "0.7.0" }
iso9660 = { package = "zemer-iso9660", path = "crates/iso9660", version = "0.7.0" }
vorbis = { package = "zemer-vorbis", path = "crates/vorbis", version = "0.7.0" }
encoding_rs = "=0.8.35"
